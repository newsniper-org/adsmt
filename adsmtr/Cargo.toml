[package]
name = "adsmtr"
version = "1.0.0-rc.41"
edition = "2021"
description = "adsmtr — the lu-kb-successor runtime + REPL (CLI trichotomy): interactive unified solve, the ASP Full-mode 3-valued well-founded model, and the lu-kb unified verdict."

[[bin]]
name = "adsmtr"
path = "src/main.rs"

[dependencies]
adsmt-lukb-driver = { path = "../adsmt-lukb-driver" }
adsmt-ir-lukb = { path = "../adsmt-ir-lukb" }
adsmt-ir-asp = { path = "../adsmt-ir-asp" }

[features]
default = []
# Forward the shared delegation stack to `adsmt-lukb-driver`, so
# `cargo build -p adsmtr --features "oxiz cas"` resolves obligations that native
# alone leaves `Unknown` through OxiZ (z3-parity) and the admit-re-checked CAS
# backends — the SAME delegation `lu-smt` has.
oxiz = ["adsmt-lukb-driver/oxiz"]
cas = ["adsmt-lukb-driver/cas"]
