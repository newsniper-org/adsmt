[package]
name = "adsmtc"
version = "1.0.0-rc.42.1"
edition = "2021"
description = "adsmtc — the lu-kb-successor compiler: parse → elaborate → lower → unified solve → UnifiedVerdict (CLI trichotomy; the batch/compile front-end over adsmt-lukb-driver)."

[[bin]]
name = "adsmtc"
path = "src/main.rs"

[dependencies]
adsmt-lukb-driver = { path = "../adsmt-lukb-driver" }
# The certificate wire (CBOR/JSON) the adsmt-emit emitters read, shared
# with `lu-smt` so both front-ends write the same bytes.
adsmt-emit-contract = { path = "../adsmt-emit/adsmt-emit-contract" }
adsmt-ir-lukb = { path = "../adsmt-ir-lukb" }

[features]
default = []
# Forward the shared delegation stack to `adsmt-lukb-driver`, so
# `cargo build -p adsmtc --features "oxiz cas"` compiles obligations that native
# alone leaves `Unknown` through OxiZ (z3-parity) and the admit-re-checked CAS
# backends — the SAME delegation `lu-smt` has.
oxiz = ["adsmt-lukb-driver/oxiz"]
cas = ["adsmt-lukb-driver/cas"]
