[package]
name = "adsmt-cas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CAS backend integration — the trusted, clean-room re-check core for untrusted Computer Algebra System oracles (docs/design/CAS_BACKEND_INTEGRATION.md). P0: the admit() re-checkers (cofactor / factor / divisor / int-solution) over exact BigRational/BigInt."

[dependencies]
# Exact arbitrary-precision arithmetic — the char-0 (ℚ) re-check ring (§9-B1:
# NEVER the GF(2) adsmt-theory-finite-field crate) + BigInt for divisor /
# Diophantine (§9-B3/G8: no i128 wrap).
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
num-integer.workspace = true
# The `adsmt.toml` `[cas]` manifest (decision 7 / §4.3).
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
# The typed-term classifier (§6): recognize an adsmt-core HOL arith term as a
# polynomial. Optional so the pure-math re-check core stays dependency-light.
adsmt-core = { workspace = true, optional = true }

[features]
default = []
# The `Term → Obligation` classifier (`term` module).
term = ["dep:adsmt-core"]

[dev-dependencies]
# For the `offline_recheck` example: deserialize a serialized `CasProof` (the
# `proof_json` embedded in an adsmt-cert `TheoryWitness::Cas`) and re-run the
# trusted `admit` re-checker WITHOUT the CAS or the solver (§7 offline replay).
serde_json.workspace = true

[[example]]
name = "offline_recheck"
path = "examples/offline_recheck.rs"
