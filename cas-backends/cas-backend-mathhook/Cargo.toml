[package]
name = "cas-backend-mathhook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MathHook (Rust CAS) IN-PROCESS backend for adsmt-cas — UNTRUSTED oracle (char-0 factorization). Unlike Singular (GPL subprocess), MathHook is MIT/Apache-2, so it links in-process. Every witness it returns is re-checked by adsmt-cas::admit; a bug here only ever yields Unknown, never a wrong verdict."

[dependencies]
adsmt-cas.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
# MathHook — the user's FORK, vendored as the `external/mathhook` SUBMODULE (branch
# master), consumed by path (mirrors how `external/oxiz` is vendored). Contribute-back
# capabilities are developed in the submodule then PR'd upstream (AhmedMashour/mathhook).
# MIT OR Apache-2.0.
mathhook-core = { path = "../../external/mathhook/crates/mathhook-core" }
