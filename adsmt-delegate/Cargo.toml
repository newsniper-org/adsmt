[package]
name = "adsmt-delegate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared delegation stack for a typed HOL sequent (H ⊢ G). `cas`: classify → dispatch to the untrusted CAS backends → return the admit-re-checked CasProof. `oxiz`: render the obligation to SMT-LIB and feed the in-process OxiZ (z3-parity) delegation. Lifted out of `lu-smt`'s Driver so `adsmt-lukb-driver` (adsmtc/adsmtr) reaches the SAME delegation both CLIs used to get only in lu-smt."

[dependencies]
# Always: the obligation Terms + the SMT-LIB renderer (needs only adsmt-core).
adsmt-core = { version = "=1.0.0-rc.42.1", path = "../adsmt-core" }
# The DatatypeDecl the renderer turns into `(declare-datatypes …)`.
adsmt-theory = { version = "=1.0.0-rc.42.1", path = "../adsmt-theory" }

# `cas` feature — the classifier + trusted re-check core + the untrusted backends
# (each admit-gated at the adsmt-cas layer; constructing them is free).
adsmt-cas = { version = "=1.0.0-rc.42.1", path = "../adsmt-cas", features = ["term"], optional = true }
cas-backend-singular = { version = "=1.0.0-rc.42.1", path = "../cas-backends/cas-backend-singular", optional = true }
cas-backend-mathhook = { version = "=1.0.0-rc.42.1", path = "../cas-backends/cas-backend-mathhook", optional = true }
cas-backend-numtheory = { version = "=1.0.0-rc.42.1", path = "../cas-backends/cas-backend-numtheory", optional = true }

# `oxiz` feature — the vendored in-process OxiZ (z3-parity). Same path dep as
# adsmt-cli's `oxiz` feature.
oxiz-solver = { path = "../external/oxiz/oxiz-solver", optional = true }
# The unsat-memo store (`memo` module, `oxiz` feature): K12-256 digests
# (lu-common `k12`) + serde JSON tier-1 entries.
lu-common = { version = "=1.0.0-rc.42.1", path = "../lu-common", default-features = false, features = ["k12"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# `asp` feature — the L5-first-slice weak-constraint optimizer wrapping
# `adsmt-ir-asp::solve::solve_weak_optimal`; the returned cost is rendered as
# `oxiz-opt`'s own `Weight` type (arithmetic-type parity with the rest of the
# delegation stack), but no `oxiz_sat`/`oxiz-opt` SEARCH is invoked — see
# `asp.rs`'s module doc for why.
adsmt-ir-asp = { path = "../adsmt-ir-asp", optional = true }
oxiz-opt = { path = "../external/oxiz/oxiz-opt", optional = true }
num-bigint = { workspace = true, optional = true }

[features]
default = []
cas = ["dep:adsmt-cas", "dep:cas-backend-singular", "dep:cas-backend-mathhook", "dep:cas-backend-numtheory"]
oxiz = ["dep:oxiz-solver", "dep:lu-common", "dep:serde", "dep:serde_json"]
asp = ["dep:adsmt-ir-asp", "dep:oxiz-opt", "dep:num-bigint"]

[dev-dependencies]
num-bigint.workspace = true
num-rational.workspace = true
tempfile = "3.27"
