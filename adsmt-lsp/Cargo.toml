[package]
name = "adsmt-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LSP server for adsmt — surfaces the cli audit JSON + cert structure to editor-agnostic clients (vscode-extension, neovim, emacs). v0.25 phase 2 of the v1.0 RC roadmap; mandatory completion target per 21F.3 option 4."

[[bin]]
name = "adsmt-lsp"
path = "src/main.rs"

[dependencies]
adsmt-cert.workspace = true
adsmt-core.workspace = true
adsmt-parser-smtlib2.workspace = true
# The typed-ASP face — a sibling crate (its own repo, edition-2024, zero-dep
# kernel), pulled in as a path dependency only when the `asp` feature is on
# (default). It supplies the advisory `lint_source` we publish as ASP
# diagnostics; keeping it optional lets the core SMT-LIB LSP build with
# `--no-default-features` (absorbed into the workspace 2026-06-27).
adsmt-ir-asp = { path = "../adsmt-ir-asp", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tower-lsp = "0.20"

[features]
default = ["asp"]
# Live typed-ASP advisory diagnostics (unsafe-variable / negative-cycle /
# vacuity) published on .asp / .lp document open + change.
asp = ["dep:adsmt-ir-asp"]
