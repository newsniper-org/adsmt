# Standalone workspace: this verification crate is meant to live beside
# `oxiz-sat-redesign-verification` and must NOT be pulled into AD1's cargo
# workspace (it has its own pinned `vstd` toolchain). Verify with either
#   verus --crate-type=lib src/lib.rs        (bundled vstd, no network)
#   cargo verus verify                        (uses the pinned vstd below)
[workspace]

[package]
name = "ccfv-verification"
version = "0.1.0"
edition = "2021"
description = "Verus pre-verification of the CCFV (E-ground (dis)unification) unified instantiation core for the OxiZ clean-MBQI engine: the three invariants the never-conclude-unsat firewall and the inner-search termination rest on — YIELD-soundness, grounding, and a strictly-decreasing search measure — proved on a standalone model before implementing Phase P1."

[dependencies]
vstd = "=0.0.0-2026-05-31-0205"

[package.metadata.verus]
verify = true

[lints.rust]
# Verus ghost code imported via `use` does not exist during a normal `cargo build`;
# guard such imports with `cfg(verus_only)` (Verus turns it on during verification).
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
